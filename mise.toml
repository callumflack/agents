[tasks.bootstrap]
description = "Link the canonical .agents payload and runtime instruction adapters"
run = "bash scripts/link-home.sh"

[tasks."repair:cursor"]
description = "Repair ~/.cursor/skills links from ~/.agents/skills"
run = 'node scripts/sync-skills.js --target="$HOME/.cursor/skills"'

[tasks."repair:codex"]
description = "Repair ~/.codex/skills links from ~/.agents/skills"
run = 'node scripts/sync-skills.js --target="$HOME/.codex/skills"'

[tasks."repair:claude"]
description = "Repair ~/.claude/skills links from ~/.agents/skills"
run = 'node scripts/sync-skills.js --target="$HOME/.claude/skills"'

[tasks."repair:cursor:prune"]
description = "Repair Cursor skill links and remove stale managed links"
run = 'node scripts/sync-skills.js --target="$HOME/.cursor/skills" --prune'

[tasks."repair:codex:prune"]
description = "Repair Codex skill links and remove stale managed links"
run = 'node scripts/sync-skills.js --target="$HOME/.codex/skills" --prune'

[tasks."repair:claude:prune"]
description = "Repair Claude skill links and remove stale managed links"
run = 'node scripts/sync-skills.js --target="$HOME/.claude/skills" --prune'

[tasks."skills:check"]
description = "Check this repo has one canonical skill manifest"
run = "node scripts/check-skill-manifest.js"

[tasks."skills:print"]
description = "Print install commands from .agents/.skill-lock.json"
run = "node scripts/install-skills-from-lock.js"

[tasks."skills:install"]
description = "Install skills from .agents/.skill-lock.json"
run = "node scripts/install-skills-from-lock.js --apply"

[tasks."plugin:pstack:sync"]
description = "Package the clean monitored Pstack checkout and advance its record"
run = "node scripts/sync-pstack-plugin.js"

[tasks."plugin:pstack:build"]
description = "Rebuild the ignored Pstack plugin from its recorded revision"
run = "node scripts/sync-pstack-plugin.js --locked"

[tasks."plugin:pstack:check"]
description = "Check Pstack ownership, freshness, schema, and runtime link"
run = "node scripts/check-skill-manifest.js && node scripts/check-pstack-plugin.js && uv run --with pyyaml python3 $HOME/.codex/skills/.system/plugin-creator/scripts/validate_plugin.py plugins/pstack"
